name: mqtt-gateway

services:
  emqx:
    image: emqx/emqx:5.8.9
    container_name: mqtt-gateway-emqx
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD__DEFAULT_PASSWORD:?EMQX_DASHBOARD__DEFAULT_PASSWORD is either not set or empty}
    ports:
      - "127.0.0.1:1883:1883"     # MQTT TCP
      - "127.0.0.1:18083:18083"   # EMQX Dashboard & REST API
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 25s
      retries: 5
      start_period: 15s

  mariadb:
    image: mariadb:11.4
    container_name: mqtt-gateway-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is either not set or empty}
      MARIADB_DATABASE: mqtt_gateway_db
      MARIADB_USER: mqtt_gateway_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is either not set or empty}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:8.8
    container_name: mqtt-gateway-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  emqx_data:
  emqx_log:
  mariadb_data:
  